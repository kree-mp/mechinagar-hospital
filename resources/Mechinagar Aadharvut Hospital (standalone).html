document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 href=\"#doctors\" style=\"font-family: 'Noto Sans Devanagari'; background: rgba(255,255,255,.12); color: #fff; font-weight: 600; font-size: 14.5px; padding: 13px 26px; border-radius: 4px; border: 1px solid rgba(255,255,255,.5);\">चिकित्सक खोज्नुहोस्<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <button onclick=\"{{ prevHero }}\" style=\"position: absolute; left: 22px; bottom: 90px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.4); background: rgba(8,12,22,.4); color: #fff; font-size: 18px; cursor: pointer;\">‹<\u002Fbutton>\n    <button onclick=\"{{ nextHero }}\" style=\"position: absolute; left: 74px; bottom: 90px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.4); background: rgba(8,12,22,.4); color: #fff; font-size: 18px; cursor: pointer;\">›<\u002Fbutton>\n    <div style=\"position: absolute; right: 34px; bottom: 100px; display: flex; gap: 8px; align-items: center;\">\n      <sc-for list=\"{{ heroDots }}\" as=\"dot\" hint-placeholder-count=\"3\">\n        <button onclick=\"{{ dot.onClick }}\" style=\"width: {{ dot.w }}; height: 9px; border-radius: 5px; border: none; padding: 0; cursor: pointer; background: {{ dot.bg }}; transition: all .4s ease;\"><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- quick access bar overlapping hero -->\n  <div style=\"max-width: 1280px; margin: 0 auto; position: relative; z-index: 5; margin-top: -48px; padding: 0 30px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;\">\n    <a href=\"#contact\" style=\"background: #fff; border: 1px solid #e4e7ec; border-top: 3px solid #D24B45; box-shadow: 0 14px 32px -18px rgba(15,23,42,.4); padding: 20px; border-radius: 4px; color: #1B262C;\" style-hover=\"transform: translateY(-3px);\">\n      <div style=\"font-family: 'Noto Sans Devanagari'; font-weight: 700; font-size: 16.5px;\">आकस्मिक सेवा<\u002Fdiv>\n      <div style=\"font-size: 13px; color: #7a818b; margin-top: 3px;\">24 hour emergency · फोन १०२<\u002Fdiv>\n    <\u002Fa>\n    <a href=\"#doctors\" style=\"background: #fff; border: 1px solid #e4e7ec; border-top: 3px solid #3282B8; box-shadow: 0 14px 32px -18px rgba(15,23,42,.4); padding: 20px; border-radius: 4px; color: #1B262C;\" style-hover=\"transform: translateY(-3px);\">\n      <div style=\"font-family: 'Noto Sans Devanagari'; font-weight: 700; font-size: 16.5px;\">चिकित्सक खोज<\u002Fdiv>\n      <div style=\"font-size: 13px; color: #7a818b; margin-top: 3px;\">Find a doctor &amp; OPD<\u002Fdiv>\n    <\u002Fa>\n    <a href=\"#patient\" style=\"background: #fff; border: 1px solid #e4e7ec; border-top: 3px solid #3282B8; box-shadow: 0 14px 32px -18px rgba(15,23,42,.4); padding: 20px; border-radius: 4px; color: #1B262C;\" style-hover=\"transform: translateY(-3px);\">\n      <div style=\"font-family: 'Noto Sans Devanagari'; font-weight: 700; font-size: 16.5px;\">ओपीडी समय<\u002Fdiv>\n      <div style=\"font-size: 13px; color: #7a818b; margin-top: 3px;\">Sun–Fri · 8:00 – 14:00<\u002Fdiv>\n    <\u002Fa>\n    <a href=\"#notices\" style=\"background: #fff; border: 1px solid #e4e7ec; border-top: 3px solid #3282B8; box-shadow: 0 14px 32px -18px rgba(15,23,42,.4); padding: 20px; border-radius: 4px; color: #1B262C;\" style-hover=\"transform: translateY(-3px);\">\n      <div style=\"font-family: 'Noto Sans Devanagari'; font-weight: 700; font-size: 16.5px;\">सूचना तथा टेन्डर<\u002Fdiv>\n      <div style=\"font-size: 13px; color: #7a818b; margin-top: 3px;\">Notices &amp; tenders<\u002Fdiv>\n    <\u002Fa>\n  <\u002Fdiv>\n\n  <!-- ========== ABOUT ========== -->\n  <div id=\"about\" style=\"max-width: 1280px; margin: 0 auto; padding: 78px 30px;\">\n    <div style=\"display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 54px; align-items: center;\">\n      <div>\n        <div style=\"font-size: 12px; letter-spacing: 2.5px; font-weight: 700; color: #D24B45;\">ABOUT THE HOSPITAL<\u002Fdiv>\n 02Fdiv>\n        <p style=\"font-family: 'Noto Sans Devanagari'; font-size: 13px; line-height: 1.7; color: rgba(255,255,255,.7); margin-top: 16px;\">नेपाल सरकारको स्वामित्वमा रहेको झापा जिल्लाको आधारभूत अस्पताल। गुणस्तरीय र सुलभ स्वास्थ्य सेवामा प्रतिबद्ध।<\u002Fp>\n        <div style=\"display: flex; gap: 8px; margin-top: 16px;\">\n          <a href=\"#\" style=\"width: 30px; height: 30px; border-radius: 5px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff;\">f<\u002Fa>\n          <a href=\"#\" style=\"width: 30px; height: 30px; border-radius: 5px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff;\">X<\u002Fa>\n          <a href=\"#\" style=\"width: 30px; height: 30px; border-radius: 5px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff;\">in<\u002Fa>\n          <a href=\"#\" style=\"width: 30px; height: 30px; border-radius: 5px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff;\">YT<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family: 'Noto Sans Devanagari'; font-weight: 700; font-size: 15px; margin-bottom: 14px;\">द्रुत पहुँच<\u002Fdiv>\n        <a href=\"#about\" style=\"display: block; font-family: 'Noto Sans Devanagari'; font-size: 13.5px; color: rgba(255,255,255,.72); padding: 6px 0;\" style-hover=\"color: #fff;\">हाम्रो बारेमा<\u002Fa>\n        <a href=\"#services\" style=\"display: block; font-family: 'Noto Sans Devanagari'; font-size: 13.5px; color: rgba(255,255,255,.72); padding: 6px 0;\" style-hover=\"color: #fff;\">सेवाहरू<\u002Fa>\n        <a href=\"#departments\" style=\"display: block; font-family: 'Noto Sans Devanagari'; font-size: 13.5px; color: rgba(255,255,255,.72); padding: 6px 0;\" style-hover=\"color: #fff;\">विभागहरू<\u002Fa>\n        <a href=\"#notices\" style=\"display: block; font-family: 'Noto Sans Devanagari'; font-size: 13.5px; color: rgba(255,255,255,.72); padding: 6px 0;\" style-hover=\"color: #fff;\">सूचना<\u002Fa>\n        <a href=\"#gallery\" style=\"display: block; font-family: 'Noto Sans Devanagari'; font-size: 13.5px; color: rgba(255,255,255,.72); padding: 6px 0;\" style-hover=\"color: #fff;\">ग्यालरी<\u002Fa>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family: 'Noto Sans Devanagari'; font-weight: 700; font-size: 15px; margin-bottom: 14px;\">सेवाहरू<\u002Fdiv>\n        <a href=\"#\" style=\"display: block; font-family: 'Noto Sans Devanagari'; font-size: 13.5px; color: rgba(255,255,255,.72); padding: 6px 0;\" style-hover=\"color: #fff;\">ओपीडी सेवा<\u002Fa>\n        <a href=\"#\" style=\"display: block; font-family: 'Noto Sans Devanagari'; font-size: 13.5px; color: rgba(255,255,255,.72); padding: 6px 0;\" style-hover=\"color: #fff;\">आकस्मिक सेवा<\u002Fa>\n        <a href=\"#\" style=\"display: block; font-family: 'Noto Sans Devanagari'; font-size: 13.5px; color: rgba(255,255,255,.72); padding: 6px 0;\" style-hover=\"color: #fff;\">प्रयोगशाला<\u002Fa>\n        <a href=\"#\" style=\"display: block; font-family: 'Noto Sans Devanagari'; font-size: 13.5px; color: rgba(255,255,255,.72); padding: 6px 0;\" style-hover=\"color: #fff;\">एम्बुलेन्स<\u002Fa>\n        <a href=\"#\" style=\"display: block; font-family: 'Noto Sans Devanagari'; font-size: 13.5px; color: rgba(255,255,255,.72); padding: 6px 0;\" style-hover=\"color: #fff;\">फार्मेसी<\u002Fa>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family: 'Noto Sans Devanagari'; font-weight: 700; font-size: 15px; margin-bottom: 14px;\">सम्पर्क<\u002Fdiv>\n        <div style=\"font-family: 'Noto Sans Devanagari'; font-size: 13.5px; color: rgba(255,255,255,.72); line-height: 1.8;\">मेचीनगर–४, झापा<br>कोशी प्रदेश, नेप  i === h ? 1 : 0 }));\n    const heroDots = slides.map((s, i) => ({ w: i === h ? '30px' : '10px', bg: i === h ? '#fff' : 'rgba(255,255,255,.45)', onClick: () => this.setState({ hero: i }) }));\n\n    // ---- clock ----\n    const now = this.state.now;\n    const time = now.toLocaleTimeString('en-GB');\n    const adDate = now.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });\n\n    // ---- services ----\n    const services = [\n      { np: 'ओपीडी सेवा', en: 'OUTPATIENT', desc: 'विशेषज्ञसहितको दैनिक बहिरंग सेवा।', tint: '#E7F1FB', color: C },\n      { np: 'आकस्मिक सेवा', en: 'EMERGENCY', desc: '२४ घण्टा आपत्कालीन उपचार र ट्रमा हेरचाह।', tint: '#E7F1FB', color: C },\n      { np: 'शल्यक्रिया', en: 'SURGERY', desc: 'सामान्य तथा विशेष शल्यक्रिया सुविधा।', tint: '#EAF4FC', color: B },\n      { np: 'प्रसूति सेवा', en: 'MATERNITY', desc: 'सुरक्षित मातृत्व र प्रसूति हेरचाह।', tint: '#EAF4FC', color: B },\n      { np: 'प्रयोगशाला', en: 'LABORATORY', desc: 'भरपर्दो रक्त तथा प्याथोलोजी परीक्षण।', tint: '#EAF4FC', color: B },\n      { np: 'रेडियोलोजी / एक्स-रे', en: 'RADIOLOGY', desc: 'एक्स-रे, अल्ट्रासाउन्ड र इमेजिङ।', tint: '#EAF4FC', color: B },\n      { np: 'फार्मेसी', en: 'PHARMACY', desc: 'सुलभ मूल्यमा औषधि उपलब्धता।', tint: '#EAF4FC', color: B },\n      { np: 'एम्बुलेन्स', en: 'AMBULANCE', desc: '२४ घण्टा एम्बुलेन्स सेवा।', tint: '#E7F1FB', color: C },\n      { np: 'खोप सेवा', en: 'IMMUNIZATION', desc: 'नियमित खोप तथा बाल स्वास्थ्य।', tint: '#EAF4FC', color: B },\n    ];\n\n    // ---- departments ----\n    const departments = [\n      { np: 'आन्तरिक चिकित्सा', en: 'General / Internal Medicine', head: 'डा. राजेन्द्र पोखरेल', opd: 'आइत–शुक्र, ८–१२', beds: 24, desc: 'ज्वरो, मधुमेह, उच्च रक्तचाप, श्वासप्रश्वास तथा सरुवा रोगलगायत आन्तरिक रोगहरूको निदान र उपचार सेवा।', services: ['सामान्य परामर्श', 'मधुमेह क्लिनिक', 'उच्च रक्तचाप', 'सरुवा रोग'] },\n      { np: 'शल्यक्रिया विभाग', en: 'General Surgery', head: 'डा. सुनिल अधिकारी', opd: 'सोम, बुध, शुक्र', beds: 18, desc: 'सामान्य तथा आकस्मिक शल्यक्रिया, ल्याप्रोस्कोपिक प्रक्रिया र शल्यक्रियापछिको हेरचाह सेवा।', services: ['सामान्य शल्यक्रिया', 'ल्याप्रोस्कोपी', 'आकस्मिक अपरेसन', 'ड्रेसिङ'] },\n      { np: 'प्रसूति तथा स्त्रीरोग', en: 'Obstetrics & Gynaecology', head: 'डा. सरिता खड्का', opd: 'आइत–शुक्र, ९–१', beds: 20, desc: 'सुरक्षित मातृत्व, गर्भवती जाँच, प्रसूति सेवा र महिला स्वास्थ्यसम्बन्धी उपचार।', services: ['गर्भवती जाँच', 'सुत्केरी सेवा', 'परिवार नियोजन', 'स्त्रीरोग'] },\n      { np: 'बालरोग विभाग', en: 'Paediatrics', head: 'डा. अनिल राई', opd: 'आइत–शुक्र, ८–१२', beds: 14, desc: 'नवजात शिशुदेखि किशोरावस्थासम्मका बालबालिकाको स्वास्थ्य जाँच, खोप र उपचार।', services: ['नवजात हेरचाह', 'खोप सेवा', 'पोषण क्लिनिक', 'बाल आकस्मिक'] },\n      { np: 'हाडजोर्नी विभाग', en: 'Orthopaedics', head: 'डा. विकास लिम्बु', opd: 'मंगल, बिही', beds: 12, desc: 'हड्डी भाँचिएको, जोर्नी तथा मांसपेशीसम्बन्धी समस्याको निदान र शल्य उपचार।', services: ['फ्र्याक्चर उपचार', 'प्लास्टर', 'जोर्नी उपचार', 'फिजियोथेरापी'] },\n      { np: 'आकस्मिक तथा सघन उपचार', en: 'Emergency & Critical Care', head: 'डा. प्रकाश गुरुङ', opd: '२४ घण्टा', beds: 10, desc: 'आपत्कालीन उपचार, ट्रमा व्यवस्थापन र सघन उपचार कक्ष (ICU) सेवा सबै समय उपलब्ध।', services: ['ट्रमा सेवा', 'ICU', 'आकस्मिक कक्ष', 'एम्बुलेन्स'] },\n      { np: 'दन्त विभाग', en: 'Dental', head: 'डा. निशा श्रेष्ठ', opd: 'आइत, मंगल, बिही', beds: 0, desc: 'दाँतको जाँच, सफाइ, भराइ, निकाल्ने तथा दन्तसम्बन्धी अन्य उपचार सेवा।', services: ['दाँत जाँच', 'सफाइ', 'फिलिङ', 'निकाल्ने'] },\n      { np: 'प्रयोगशाला तथा रेडियोलोजी', en: 'Diagnostics (Lab & Radiology)', head: 'डा. मनोज भट्टराई', opd: 'आइत–शुक्र, ७–४', beds: 0, desc: 'रक्त परीक्षण, प्याथोलोजी, एक्स-रे, अल्ट्रासाउन्डलगायत भरपर्दो निदान सेवा।', services: ['रक्त परीक्षण', 'प्याथोलोजी', 'एक्स-रे', 'अल्ट्रासाउन्ड'] },\n    ];\n    const dIdx = this.state.dept;\n    const deptList = departments.map((d, i) => ({\n      np: d.np, en: d.en,\n      pick: () => this.setState({ dept: i }),\n      bg: i === dIdx ? '#EAF4FC' : '#fff',\n      bar: i === dIdx ? C : 'transparent',\n      fg: i === dIdx ? C : '#1B262C',\n    }));\n    const ad = departments[dIdx];\n    const activeDept = { ...ad, bedsLabel: ad.beds > 0 ? ('शय्या: ' + ad.beds) : 'दैनिक सेवा' };\n    const deptMenuList = departments.map((d, i) => ({ np: d.np, en: d.en, pick: () => this.setState({ dept: i, deptMenuOpen: false }) }));\n\n    // ---- doctors ----\n    const allDocs = [\n      { name: 'डा. राजेन्द्र पोखरेल', qual: 'MBBS, MD (Medicine)', dept: 'आन्तरिक चिकित्सा', deptId: 0, opd: 'आइत–शुक्र' },\n      { name: 'डा. सुनिल अधिकारी', qual: 'MBBS, MS (Surgery)', dept: 'शल्यक्रिया', deptId: 1, opd: 'सोम, बुध, शुक्र' },\n      { name: 'डा. सरिता खड्का', qual: 'MBBS, MD (OBGYN)', dept: 'प्रसूति तथा स्त्रीरोग', deptId: 2, opd: 'आइत–शुक्र' },\n      { name: 'डा. अनिल राई', qual: 'MBBS, MD (Paeds)', dept: 'बालरोग', deptId: 3, opd: 'आइत–शुक्र' },\n      { name: 'डा. विकास लिम्बु', qual: 'MBBS, MS (Ortho)', dept: 'हाडजोर्नी', deptId: 4, opd: 'मंगल, बिही' },\n      { name: 'डा. प्रकाश गुरुङ', qual: 'MBBS, Emergency Med.', dept: 'आकस्मिक', deptId: 5, opd: '२४ घण्टा' },\n      { name: 'डा. निशा श्रेष्ठ', qual: 'BDS', dept: 'दन्त', deptId: 6, opd: 'आइत, मंगल, बिही' },\n      { name: 'डा. मनोज भट्टराई', qual: 'MD (Radiology)', dept: 'रेडियोलोजी', deptId: 7, opd: 'आइत–शुक्र' },\n    ];\n    const filter = this.state.docFilter;\n    const docs = filter === 'all' ? allDocs : allDocs.filter(d => d.deptId === filter);\n    const chipDefs = [{ id: 'all', label: 'सबै' }, { id: 0, label: 'आन्तरिक' }, { id: 1, label: 'शल्यक्रिया' }, { id: 2, label: 'स्त्रीरोग' }, { id: 3, label: 'बालरोग' }, { id: 5, label: 'आकस्मिक' }];\n    const docChips = chipDefs.map(c => ({\n      label: c.label,\n      pick: () => this.setState({ docFilter: c.id }),\n      bg: filter === c.id ? C : '#fff',\n      fg: filter === c.id ? '#fff' : '#41474f',\n      border: filter === c.id ? C : '#d9dce1',\n    }));\n\n    // ---- notices
